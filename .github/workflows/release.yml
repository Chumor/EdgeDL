name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Whether to publish a release"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

  pull_request:
    types: [closed]
    branches:
      - dev
      - main

  push:
    branches:
      - dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true || github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MIN_RELEASE_COMMITS: 3

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - name: Resolve Base Version
        id: base
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Resolve Channel Version
        id: version
        run: |
          BASE="${{ steps.base.outputs.base }}"
          SHA=$(git rev-parse --short HEAD)


          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          fi

          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "dev" ]; then
            LAST=$(git tag -l "v${BASE}-beta.*" | sort -V | tail -n 1)

            if [ -z "$LAST" ]; then
              N=0
            else
              N=$(echo "$LAST" | sed -E 's/.*-beta\.([0-9]+).*/\1/')
            fi

            VERSION="${BASE}-beta.$((N + 1))+${SHA}"
            PRERELEASE=true
          else
            VERSION="${BASE}"
            PRERELEASE=false
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Inject Version Header
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
          BEGIN { found=0 }
          /@version/ {
            printf "// @version      %s\n", ver
            found=1
            next
          }
          { print }
          END {
            if (!found) printf "// @version      %s\n", ver
          }' dist/EdgeDL.user.js > dist/EdgeDL.tmp \
          && mv dist/EdgeDL.tmp dist/EdgeDL.user.js

      - name: Generate Changelog
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          fi

          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "dev" ]; then
            echo "Using beta tags"
            LAST_TAG=$(git tag -l "v*-beta.*" | sort -V | tail -n 1)
          else
            echo "Using stable tags"
            LAST_TAG=$(git tag -l "v[0-9]*" | grep -v beta | sort -V | tail -n 1)
          fi

          echo "Last tag: $LAST_TAG"

          if [ -n "$LAST_TAG" ]; then
            npx -y conventional-changelog-cli -p angular \
              --from $LAST_TAG \
              --to HEAD \
              --tag-prefix v \
              > RELEASE_NOTES.md
          else
            npx -y conventional-changelog-cli -p angular \
              --tag-prefix v \
              > RELEASE_NOTES.md
          fi

      - name: Check for New Commits
        id: check_commits
        run: |
          BASE="${{ steps.base.outputs.base }}"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.base.ref }}"
          fi


          if [ "$BRANCH" = "dev" ]; then
            LAST_TAG=$(git tag -l "v${BASE}-beta.*" | sort -V | tail -n 1)
          else
            LAST_TAG=$(git tag -l "v${BASE}" | grep -v beta | sort -V | tail -n 1)
          fi

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git rev-list $LAST_TAG..HEAD --count)
          else
            COMMITS=$(git rev-list HEAD --count)
          fi

          echo "Commits since last tag: $COMMITS"
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT

      - name: Conditional Release
        id: create_release
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
          (github.event_name == 'push' && steps.check_commits.outputs.commits >= env.MIN_RELEASE_COMMITS)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/EdgeDL.user.js
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: false

      - name: Write release info to summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          COMMITS="${{ steps.check_commits.outputs.commits }}"

          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            STATUS="Published"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          elif [ "${COMMITS}" -lt "${{ env.MIN_RELEASE_COMMITS }}" ] && [ "${{ github.event_name }}" == "push" ]; then
            STATUS="Skipped (insufficient commits: ${COMMITS}/${{ env.MIN_RELEASE_COMMITS }})"
            RELEASE_URL="N/A"
          elif [ "${COMMITS}" == "0" ]; then
            STATUS="Skipped (no new commits)"
            RELEASE_URL="N/A"
          else
            STATUS="Skipped or failed"
            RELEASE_URL="N/A"
          fi

          {
            echo "## Release Summary"
            echo ""
            echo "| Item                       | Details                         |"
            echo "|:---------------------------|:--------------------------------|"
            echo "| **Version**                | $VERSION |"
            echo "| **Prerelease**             | $PRERELEASE |"
            echo "| **Commits since last tag** | $COMMITS |"
            echo "| **Release Status**         | $STATUS |"
            echo "| **Release URL**            | [link]($RELEASE_URL) |"
          } >> $GITHUB_STEP_SUMMARY
