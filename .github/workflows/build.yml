name: Build Userscript

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.*"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.*"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    if: |
      !contains(github.event.head_commit.message || '', '[skip build]')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare artifact file
        id: artifact
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          if [ "${GITHUB_REF_NAME}" = "main" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${BASE_VERSION}"
          else
            VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          fi

          sed -i -E "s|//[[:space:]]*@version[[:space:]]+.*|// @version      ${VERSION}|" dist/EdgeDL.user.js

          FILE="dist/EdgeDL-v${VERSION}.user.js"
          cp dist/EdgeDL.user.js "$FILE"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7