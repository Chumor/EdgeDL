name: Preview Release Userscript

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "rollup.config.*"
      - "tsconfig.json"
      - "scripts/build-platform-userscripts.mjs"
      - "scripts/platform-meta.json"
      - ".github/workflows/preview-release.yml"

permissions:
  contents: write

jobs:
  preview_release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.head_commit.message, '[release]') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare preview asset
        id: asset
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="${BASE_VERSION}-dev.${SHORT_SHA}"
          TAG="v${VERSION}"

          sed -i -E "s|//[[:space:]]*@version[[:space:]]+.*|// @version      ${VERSION}|" dist/EdgeDL.user.js

          FILE="dist/EdgeDL-v${VERSION}.user.js"
          cp dist/EdgeDL.user.js "$FILE"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "path=${FILE}" >> "$GITHUB_OUTPUT"

      - name: Build platform sync assets
        run: npm run build:platform

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)
          CURR_TAG="${{ steps.asset.outputs.tag }}"
          VERSION="${{ steps.asset.outputs.version }}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          CHANGES_FILE=$(mktemp)
          COMMITS_FILE=$(mktemp)

          if [ -n "$PREV_TAG" ]; then
            LOG_RANGE="$PREV_TAG..HEAD"
            BASE_LABEL="$PREV_TAG"
            COMPARE_RANGE="${PREV_TAG}...${CURR_TAG}"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${COMPARE_RANGE}"
          else
            LOG_RANGE="HEAD"
            BASE_LABEL="None"
            COMPARE_RANGE="${CURR_TAG}"
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          fi

          git log "$LOG_RANGE" --pretty=format:"%s" > "$COMMITS_FILE" || true

          while IFS= read -r subject || [ -n "$subject" ]; do
            case "$subject" in
              Merge*) continue ;;
            esac

            title=$(printf '%s' "$subject" \
              | sed -E 's/[[:space:]]*\[release\].*$//' \
              | sed -E 's/[[:space:]]+-[[:space:]].*$//')
            [ -z "$title" ] && continue

            type=$(printf '%s' "$title" | sed -nE 's/^([a-z]+)(\([^)]+\))?(!)?:[[:space:]]+.*/\1/p')
            text=$(printf '%s' "$title" | sed -E 's/^[a-z]+(\([^)]+\))?(!)?:[[:space:]]+//')
            [ -z "$type" ] && type="other"

            printf '%s\t%s\n' "$type" "$text" >> "$CHANGES_FILE"
          done < "$COMMITS_FILE"

          {
            echo "## EdgeDL v${VERSION}"
            echo ""
            echo "**Channel:** Preview  "
            echo "**Commit:** \`${SHORT_SHA}\`  "
            echo "**Base:** \`${BASE_LABEL}\`"
            echo ""
            echo "## Changelog"
          } > RELEASE_NOTES.md

          append_group() {
            type="$1"
            heading="$2"
            items=$(awk -F '\t' -v type="$type" '$1 == type { print "- " $2 }' "$CHANGES_FILE")
            [ -z "$items" ] && return

            echo "" >> RELEASE_NOTES.md
            echo "### $heading" >> RELEASE_NOTES.md
            printf '%s\n' "$items" >> RELEASE_NOTES.md
          }

          append_group feat "Features"
          append_group fix "Bug Fixes"
          append_group perf "Performance"
          append_group refactor "Refactoring"
          append_group docs "Documentation"
          append_group style "Styles"
          append_group ci "CI"
          append_group test "Tests"
          append_group chore "Chores"
          append_group other "Other Changes"

          if ! grep -q '^### ' RELEASE_NOTES.md; then
            echo "" >> RELEASE_NOTES.md
            echo "No preview changes found." >> RELEASE_NOTES.md
          fi

          echo "" >> RELEASE_NOTES.md
          echo "**Full Changelog:** [\`${COMPARE_RANGE}\`](${COMPARE_URL})" >> RELEASE_NOTES.md

      - name: Delete existing base preview releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_TAG=$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)
          if [ -z "$BASE_TAG" ]; then
            echo "No stable base tag found."
            exit 1
          fi

          BASE_PREFIX="${BASE_TAG}-dev."

          gh release list --limit 100 --json tagName,isPrerelease \
            --jq ".[] | select(.isPrerelease and (.tagName | startswith(\"${BASE_PREFIX}\"))) | .tagName" \
            | while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "Deleting preview release ${tag}"
                gh release delete "$tag" --cleanup-tag -y
              done

          git ls-remote --tags origin "${BASE_PREFIX}*" \
            | awk '{ print $2 }' \
            | sed -E 's#refs/tags/##; s/\^\{\}$//' \
            | sort -u \
            | while IFS= read -r tag; do
                [ -z "$tag" ] && continue
                echo "Deleting dangling preview tag ${tag}"
                git push origin ":refs/tags/${tag}" || true
              done

      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.asset.outputs.tag }}" \
            "${{ steps.asset.outputs.path }}" \
            --title "${{ steps.asset.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --prerelease

      - name: Upload platform sync assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload platform-sync \
            dist/EdgeDL.user.js \
            dist/EdgeDL.meta.js \
            dist/EdgeDL.scriptcat.user.js \
            dist/EdgeDL.greasyfork.user.js \
            --clobber